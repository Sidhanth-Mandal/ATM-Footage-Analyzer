# BoT-SORT config for the coarse pass. track_buffer is overwritten at runtime
# with round(coarse.lost_s * coarse.sample_fps) (expressed in sampled frames).
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 25
match_thresh: 0.8
fuse_score: True
gmc_method: none   # fixed CCTV camera: no global motion compensation needed
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
